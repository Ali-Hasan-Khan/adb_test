version: '2'
services:
  api:
    build: .
    container_name: api
    command: bash -c "cd /src/rest && python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    links:
      - mongo
    volumes:
      - ${ADBREW_CODEBASE_PATH}/tmp:/tmp
      - ${ADBREW_CODEBASE_PATH}:/src

  app:
    build: .
    container_name: app
    command: bash -c "cd /src/app && yarn install && yarn start"
    ports:
      - "3000:3000"
    volumes:
      - ${ADBREW_CODEBASE_PATH}:/src

  mongo:
    # Official MongoDB 4.4 image (matches the server version the original
    # Dockerfile installed). Previously this service was built from the same
    # python image via `build: .`, but mongodb-org 4.4 cannot install on the
    # current bookworm-based base (needs libssl1.1, only libssl3 available).
    # Everything else about this service (name, ports, volume, command) is
    # unchanged, so `api` still reaches it at MONGO_HOST=mongo:27017.
    image: mongo:4.4
    container_name: mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - ${ADBREW_CODEBASE_PATH}/db/:/data/db
    command: /usr/bin/mongod --bind_ip 0.0.0.0

    